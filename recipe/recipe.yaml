schema_version: 1

context:
  name: nomad-camels-driver-keithley-220
  version: "0.1.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/nomad_camels_driver_keithley_220-${{ version }}.tar.gz
  sha256: de5bb24566bc7855a6de3c2aab90a4ef191035b9eabd4446f5064676fd0d7eb8

build:
  number: 4
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=61.0
    - pip
  run:
    - python >=${{ python_min }}
    - pyvisa
    - pyvisa-py

tests:
  - python:
      imports:
        - nomad_camels_driver_keithley_220
      pip_check: true
      python_version:
        - ${{ python_min }}
        - "*"

about:
  summary: Device driver for the Keithley 220 programmable current source.
  license: LGPL-2.1-or-later
  license_file: LICENSE.txt
  homepage: https://github.com/FAU-LAP/CAMELS_drivers

extra:
  recipe-maintainers:
    - jan-janssen
